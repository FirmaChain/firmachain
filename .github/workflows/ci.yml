name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, edited, synchronize]
env:
  GO_VERSION: 1.23

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check go.mod
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1
          args: --no-config --default=none --enable=govet --enable=ineffassign --enable=unused --timeout=10m

  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make install

    - name: Test
      run: go test ./... -coverprofile=coverage.txt -covermode=atomic